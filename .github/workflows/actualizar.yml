name: Actualizar datos

on:
  schedule:
    - cron: "37 4 * * *"   # 11:37 p. m. en Bogotá, todos los días
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar paquetes
        run: Rscript -e 'install.packages(c("httr", "jsonlite"))'

      # El servidor del Banco no envía el certificado intermedio de DigiCert.
      # Se baja el oficial, se comprueba que lo firma la raíz de DigiCert que
      # ya trae el sistema y se agrega a la lista de confianza.
      - name: Completar certificado del Banco
        run: |
          curl -sSf -m 60 -o geotrust.crt http://cacerts.digicert.com/GeoTrustEVRSACAG2.crt
          openssl x509 -inform DER -in geotrust.crt -out geotrust.pem 2>/dev/null || cp geotrust.crt geotrust.pem
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt geotrust.pem
          cat /etc/ssl/certs/ca-certificates.crt geotrust.pem > "$RUNNER_TEMP/ca-banrep.pem"
          echo "CURL_CA_BUNDLE=$RUNNER_TEMP/ca-banrep.pem" >> "$GITHUB_ENV"
          rm geotrust.crt geotrust.pem

      - name: Bajar series del Banco de la República
        id: datos
        run: Rscript R/actualizar.R

      - name: Guardar cambios
        run: |
          git config user.name "datos-colombia[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos al $(TZ=America/Bogota date '+%Y-%m-%d')"
            git push
          fi

      - name: Avisar si hay datos nuevos
        if: steps.datos.outputs.hay_novedades == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Datos nuevos del BanRep: $(TZ=America/Bogota date '+%d/%m/%Y')" \
            --body-file NOVEDADES.md
