name: Actualizar datos

on:
  schedule:
    - cron: "37 4 * * *"   # 11:37 p. m. en Bogotá, todos los días
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar paquetes
        run: Rscript -e 'install.packages(c("httr", "jsonlite"))'

      - name: Bajar series del Banco de la República
        id: datos
        run: Rscript R/actualizar.R

      - name: Guardar cambios
        run: |
          git config user.name "datos-colombia[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos al $(TZ=America/Bogota date '+%Y-%m-%d')"
            git push
          fi

      - name: Avisar si hay datos nuevos
        if: steps.datos.outputs.hay_novedades == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Datos nuevos del BanRep: $(TZ=America/Bogota date '+%d/%m/%Y')" \
            --body-file NOVEDADES.md
