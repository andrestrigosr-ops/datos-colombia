name: Diagnóstico de conexión
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo | openssl s_client -connect suameca.banrep.gov.co:443 -servername suameca.banrep.gov.co -showcerts 2>/dev/null > /tmp/chain.txt
          grep -E "^ *[0-9] s:|^ *i:|Verify return" /tmp/chain.txt
          openssl s_client -connect suameca.banrep.gov.co:443 -servername suameca.banrep.gov.co </dev/null 2>/dev/null | openssl x509 -noout -text | grep -A2 "Authority Information Access"
